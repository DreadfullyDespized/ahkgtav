name: release-asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach AHKGEO.ahk to"
        required: true
        type: string

concurrency:
  group: release-asset-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Attach AHKGEO.ahk from this tag to its release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test -f AHKGEO.ahk
          gh release upload "$TAG" AHKGEO.ahk --clobber
          size=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "AHKGEO.ahk") | .size')
          test -n "$size"
          echo "AHKGEO.ahk attached to $TAG: $size bytes"
